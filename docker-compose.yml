version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - EMAIL_USR=${EMAIL_USR}
      - APP_PASS=${APP_PASS}
      - CLOUD_NAME=${CLOUD_NAME}
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - DB_HOST=bvuqipi0a6c4ti09dhjj-mysql.services.clever-cloud.com
      - DB_USER=ui0wmhhinavbtwtg
      - DB_PASSWORD=OVvi1Hy20LSqkRMazApC
      - DB_NAME=bvuqipi0a6c4ti09dhjj
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/tmp:/app/tmp
    networks:
      - shelfx-network
    depends_on:
      - redis

  # Redis service
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - shelfx-network

  # Database service removed - using cloud database instead

networks:
  shelfx-network:
    driver: bridge